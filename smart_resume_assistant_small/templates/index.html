<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能求职助手 - 简历分析与优化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-briefcase me-2"></i>
                    智能求职助手
                </a>
                <span class="navbar-text">
                    快速评估、优化简历，提升求职成功率
                </span>
            </div>
        </nav>

        <div class="container">
            <!-- 功能介绍 -->
            <div class="row mb-5">
                <div class="col-12">
                    <div class="text-center">
                        <h1 class="display-5 fw-bold text-primary mb-3">智能简历分析平台</h1>
                        <p class="lead text-muted mb-4">上传简历，输入职位描述，获得专业的匹配分析和优化建议</p>
                    </div>
                </div>
            </div>

            <!-- 功能特色 -->
            <div class="row mb-5">
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="feature-card text-center p-4">
                        <div class="feature-icon mb-3">
                            <i class="fas fa-upload fa-2x text-primary"></i>
                        </div>
                        <h5>简历上传</h5>
                        <p class="text-muted">支持PDF、DOCX格式</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="feature-card text-center p-4">
                        <div class="feature-icon mb-3">
                            <i class="fas fa-search fa-2x text-success"></i>
                        </div>
                        <h5>智能匹配</h5>
                        <p class="text-muted">分析简历与岗位匹配度</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="feature-card text-center p-4">
                        <div class="feature-icon mb-3">
                            <i class="fas fa-lightbulb fa-2x text-warning"></i>
                        </div>
                        <h5>优化建议</h5>
                        <p class="text-muted">个性化简历改进方案</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="feature-card text-center p-4">
                        <div class="feature-icon mb-3">
                            <i class="fas fa-question-circle fa-2x text-info"></i>
                        </div>
                        <h5>模拟面试</h5>
                        <p class="text-muted">生成常见面试问题</p>
                    </div>
                </div>
            </div>

            <!-- 主要功能区域 -->
            <div class="row">
                <!-- 文件上传区域 -->
                <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-file-upload me-2"></i>
                                步骤1: 上传简历
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="upload-area" class="upload-area text-center p-4 border-dashed">
                                <div class="upload-icon mb-3">
                                    <i class="fas fa-cloud-upload-alt fa-3x text-muted"></i>
                                </div>
                                <h6>拖拽文件到此处或点击选择</h6>
                                <p class="text-muted mb-3">支持 PDF、DOCX 格式，最大 16MB</p>
                                <input type="file" id="resume-file" name="resume" accept=".pdf,.docx" class="d-none">
                                <button type="button" class="btn btn-outline-primary" onclick="document.getElementById('resume-file').click()">
                                    <i class="fas fa-folder-open me-2"></i>
                                    选择文件
                                </button>
                            </div>
                            <div id="file-info" class="mt-3" style="display: none;">
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <span id="file-name"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- JD输入区域 -->
                <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-edit me-2"></i>
                                步骤2: 输入职位描述
                            </h5>
                        </div>
                        <div class="card-body">
                            <textarea id="jd-text" class="form-control" rows="12" 
                                placeholder="请粘贴完整的职位描述(JD)，包括：&#10;• 职位名称&#10;• 工作职责&#10;• 任职要求&#10;• 技能要求&#10;• 工作经验要求&#10;等信息...&#10;&#10;至少需要50个字符"></textarea>
                            <div class="mt-2">
                                <small class="text-muted">
                                    <span id="char-count">0</span> / 50 字符（最少）
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分析按钮 -->
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <button id="analyze-btn" class="btn btn-primary btn-lg px-5" disabled>
                        <i class="fas fa-search me-2"></i>
                        开始智能分析
                    </button>
                </div>
            </div>

            <!-- 加载状态 -->
            <div id="loading" class="row" style="display: none;">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body text-center py-5">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">分析中...</span>
                            </div>
                            <h5>正在分析您的简历...</h5>
                            <p class="text-muted">这可能需要几秒钟时间，请耐心等待</p>
                            <div class="progress-info mb-2">
                                <span id="analysis-status" class="text-muted">正在分析简历内容...</span>
                            </div>
                            <div class="progress mt-3" style="height: 6px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%" aria-valuenow="0" 
                                     aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 结果展示区域 -->
            <div id="results" style="display: none;">
                <!-- 结果内容将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <!-- 提示信息模态框 -->
    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="alertModalTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="alertModalBody">
                    <!-- 提示内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本文件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let uploadedFile = null;
        let analysisInProgress = false;

        // DOM元素
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('resume-file');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const jdTextarea = document.getElementById('jd-text');
        const charCount = document.getElementById('char-count');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const progressBar = document.querySelector('.progress-bar');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            setupDragAndDrop();
        });

        // 设置事件监听器
        function setupEventListeners() {
            fileInput.addEventListener('change', handleFileSelect);
            jdTextarea.addEventListener('input', handleJDInput);
            analyzeBtn.addEventListener('click', handleAnalyze);
        }

        // 设置拖拽功能
        function setupDragAndDrop() {
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, preventDefaults, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, unhighlight, false);
            });

            uploadArea.addEventListener('drop', handleDrop, false);
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function highlight(e) {
            uploadArea.classList.add('drag-over');
        }

        function unhighlight(e) {
            uploadArea.classList.remove('drag-over');
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        }

        function handleFiles(files) {
            const file = files[0];
            if (validateFile(file)) {
                uploadedFile = file;
                displayFileInfo(file);
                validateForm();
            }
        }

        function validateFile(file) {
            const maxSize = 16 * 1024 * 1024; // 16MB
            const allowedTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];

            if (file.size > maxSize) {
                showAlert('错误', '文件大小不能超过16MB');
                return false;
            }

            if (!allowedTypes.includes(file.type)) {
                showAlert('错误', '只支持PDF和DOCX格式的文件');
                return false;
            }

            return true;
        }

        function displayFileInfo(file) {
            const fileSize = formatFileSize(file.size);
            const fileType = file.type.includes('pdf') ? 'PDF' : 'DOCX';
            fileName.textContent = `${file.name} (${fileSize}, ${fileType})`;
            fileInfo.style.display = 'block';
            uploadArea.classList.add('file-selected');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function handleJDInput(e) {
            const text = e.target.value;
            charCount.textContent = text.length;
            
            if (text.length >= 50) {
                charCount.classList.remove('text-danger');
                charCount.classList.add('text-success');
            } else {
                charCount.classList.remove('text-success');
                charCount.classList.add('text-danger');
            }
            
            validateForm();
        }

        function validateForm() {
            const hasFile = uploadedFile !== null;
            const hasValidJD = jdTextarea.value.trim().length >= 50;
            
            analyzeBtn.disabled = !(hasFile && hasValidJD) || analysisInProgress;
        }

        async function handleAnalyze() {
            if (!uploadedFile || jdTextarea.value.trim().length < 50 || analysisInProgress) {
                return;
            }

            analysisInProgress = true;
            validateForm();
            showLoading();

            try {
                const formData = new FormData();
                formData.append('resume', uploadedFile);
                formData.append('jd_text', jdTextarea.value.trim());

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                // 检查HTTP状态码
                if (!response.ok) {
                    // 处理429限流错误
                    if (response.status === 429) {
                        showAlert('请求过于频繁', '您的请求过于频繁，请等待一分钟后重试。每人每分钟最多提交5次分析。');
                        return;
                    }
                    throw new Error(`HTTP错误: ${response.status} ${response.statusText}`);
                }

                // 添加调试信息
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                // 先获取响应文本，然后尝试解析JSON
                const responseText = await response.text();
                console.log('Response text:', responseText);
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    console.error('JSON解析错误:', jsonError);
                    console.error('响应内容:', responseText);
                    throw new Error('服务器响应格式错误: ' + responseText.substring(0, 100));
                }

                console.log('Parsed result:', result);

                if (result.success) {
                    displayResults(result.data);
                } else {
                    showAlert('分析失败', result.error || '未知错误');
                }
            } catch (error) {
                console.error('分析错误:', error);
                let errorMessage = '网络错误或服务器异常';
                
                // 提供更具体的错误信息
                if (error.message.includes('HTTP错误')) {
                    errorMessage = error.message;
                } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMessage = '网络连接失败，请检查网络连接';
                } else if (error.message.includes('JSON') || error.message.includes('服务器响应格式错误')) {
                    errorMessage = error.message;
                } else {
                    errorMessage = '分析过程中出现错误: ' + error.message;
                }
                
                showAlert('分析失败', errorMessage);
            } finally {
                hideLoading();
                analysisInProgress = false;
                validateForm();
            }
        }

        function showLoading() {
            loadingDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            
            // 更新分析状态
            const statusElement = document.getElementById('analysis-status');
            let statusMessages = [
                '正在提取简历文本...',
                '正在尝试大模型解析...',
                '正在进行智能匹配分析...',
                '正在生成优化建议...'
            ];
            let messageIndex = 0;
            
            // 模拟进度条和状态更新
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressBar.style.width = progress + '%';
                progressBar.setAttribute('aria-valuenow', progress);
                
                // 更新状态消息
                if (progress > 25 * (messageIndex + 1) && messageIndex < statusMessages.length - 1) {
                    messageIndex++;
                    statusElement.textContent = statusMessages[messageIndex];
                }
                
                if (!analysisInProgress) {
                    progress = 100;
                    progressBar.style.width = '100%';
                    progressBar.setAttribute('aria-valuenow', 100);
                    statusElement.textContent = '分析完成！';
                    clearInterval(interval);
                }
            }, 200);
        }

        function hideLoading() {
            loadingDiv.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.setAttribute('aria-valuenow', 0);
        }

        function displayResults(data) {
            const resultsHTML = buildResultsHTML(data);
            resultsDiv.innerHTML = resultsHTML;
            resultsDiv.style.display = 'block';
            
            // 显示解析方式标识
            if (data.parsing_method) {
                showParsingMethodBadge(data.parsing_method);
            }
            
            // 滚动到结果区域
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }
        
        function showParsingMethodBadge(method) {
            const badge = document.createElement('div');
            badge.className = 'alert alert-info alert-dismissible fade show mt-2';
            badge.innerHTML = `
                <i class="fas fa-info-circle me-2"></i>
                <strong>解析方式:</strong> ${method === 'llm' ? '🤖 大模型智能解析' : '📋 传统规则解析'}
                ${method === 'llm' ? '<small class="d-block">使用大语言模型进行深度语义理解</small>' : '<small class="d-block">使用传统关键词匹配方法</small>'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            resultsDiv.insertBefore(badge, resultsDiv.firstChild);
        }

        function buildResultsHTML(data) {
            // 处理match_analysis数据
            let matchAnalysis = null;
            let matchAnalysisError = null;
            
            if (data.match_analysis && data.match_analysis.success && data.match_analysis.data) {
                matchAnalysis = data.match_analysis.data;
            } else if (data.match_analysis && !data.match_analysis.success) {
                matchAnalysisError = data.match_analysis.error || '简历或职位描述解析失败';
            } else {
                matchAnalysisError = '匹配分析数据无效';
            }
            
            const matchScore = matchAnalysis?.overall_match_score || matchAnalysis?.overall_score || 0;
            const skillScore = matchAnalysis?.detailed_analysis?.skills_match?.score || matchAnalysis?.skill_score || 0;
            const experienceScore = matchAnalysis?.detailed_analysis?.experience_match?.score || matchAnalysis?.experience_score || 0;
            const educationScore = matchAnalysis?.detailed_analysis?.education_match?.score || 0;
            
            // 处理optimization数据
            let optimizationData = null;
            let optimizationError = null;
            
            if (data.optimization && data.optimization.success && data.optimization.data) {
                optimizationData = data.optimization.data;
            } else if (data.optimization && !data.optimization.success) {
                optimizationError = data.optimization.error || '优化建议生成失败';
            } else {
                optimizationError = '匹配分析数据无效';
            }
            
            // 处理interview_questions数据
            let interviewError = null;
            if (data.interview_questions && !data.interview_questions.success) {
                interviewError = data.interview_questions.error || '面试问题生成失败';
            } else if (!data.interview_questions || !data.interview_questions.data) {
                interviewError = '简历或职位描述数据无效';
            }

            return `
                <div class="card mt-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-line me-2"></i>
                            分析结果
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- 匹配度分数 -->
                        ${matchAnalysisError ? `
                            <div class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                匹配分析: ${matchAnalysisError}
                            </div>
                        ` : `
                        <div class="row mb-4">
                            <div class="col-md-3 text-center">
                                <div class="score-circle ${getScoreClass(matchScore)}">
                                    <span class="score-number">${matchScore}</span>
                                    <span class="score-label">总体匹配度</span>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="score-circle ${getScoreClass(skillScore)}">
                                    <span class="score-number">${skillScore}</span>
                                    <span class="score-label">技能匹配度</span>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="score-circle ${getScoreClass(experienceScore)}">
                                    <span class="score-number">${experienceScore}</span>
                                    <span class="score-label">经验匹配度</span>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="score-circle ${getScoreClass(educationScore)}">
                                    <span class="score-number">${educationScore}</span>
                                    <span class="score-label">教育匹配度</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 详细分析 -->
                        <div class="row">
                            <div class="col-md-6">
                                <h6><i class="fas fa-check-circle text-success me-2"></i>匹配技能</h6>
                                <div class="skills-container mb-3">
                                    ${buildSkillTags(matchAnalysis?.detailed_analysis?.skills_match?.matched_skills || matchAnalysis?.matched_skills || [], 'matched')}
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h6><i class="fas fa-exclamation-circle text-warning me-2"></i>缺失技能</h6>
                                <div class="skills-container mb-3">
                                    ${buildSkillTags(matchAnalysis?.detailed_analysis?.skills_match?.missing_skills || matchAnalysis?.missing_skills || [], 'missing')}
                                </div>
                            </div>
                        </div>
                        
                        <!-- 详细分析报告 -->
                        ${matchAnalysis?.detailed_analysis ? `
                        <div class="mt-4">
                            <h6><i class="fas fa-chart-bar text-info me-2"></i>详细分析报告</h6>
                            <div class="row">
                                ${matchAnalysis.detailed_analysis.skills_match ? `
                                <div class="col-md-4 mb-3">
                                    <div class="card h-100">
                                        <div class="card-header bg-primary text-white">
                                            <h6 class="mb-0">技能分析 (${matchAnalysis.detailed_analysis.skills_match.score}分)</h6>
                                        </div>
                                        <div class="card-body">
                                            <p class="small">${matchAnalysis.detailed_analysis.skills_match.analysis}</p>
                                        </div>
                                    </div>
                                </div>
                                ` : ''}
                                ${matchAnalysis.detailed_analysis.experience_match ? `
                                <div class="col-md-4 mb-3">
                                    <div class="card h-100">
                                        <div class="card-header bg-success text-white">
                                            <h6 class="mb-0">经验分析 (${matchAnalysis.detailed_analysis.experience_match.score}分)</h6>
                                        </div>
                                        <div class="card-body">
                                            <p class="small">${matchAnalysis.detailed_analysis.experience_match.analysis}</p>
                                        </div>
                                    </div>
                                </div>
                                ` : ''}
                                ${matchAnalysis.detailed_analysis.education_match ? `
                                <div class="col-md-4 mb-3">
                                    <div class="card h-100">
                                        <div class="card-header bg-warning text-white">
                                            <h6 class="mb-0">教育分析 (${matchAnalysis.detailed_analysis.education_match.score}分)</h6>
                                        </div>
                                        <div class="card-body">
                                            <p class="small">${matchAnalysis.detailed_analysis.education_match.analysis}</p>
                                        </div>
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        ` : ''}
                        `}
                        
                        <!-- 优势与劣势分析 -->
                        ${matchAnalysis?.strengths || matchAnalysis?.weaknesses ? `
                        <div class="mt-4">
                            <div class="row">
                                ${matchAnalysis.strengths ? `
                                <div class="col-md-6">
                                    <h6><i class="fas fa-thumbs-up text-success me-2"></i>优势</h6>
                                    <ul class="list-group list-group-flush">
                                        ${matchAnalysis.strengths.map(strength => `<li class="list-group-item border-0 px-0 py-1"><i class="fas fa-check text-success me-2"></i>${strength}</li>`).join('')}
                                    </ul>
                                </div>
                                ` : ''}
                                ${matchAnalysis.weaknesses ? `
                                <div class="col-md-6">
                                    <h6><i class="fas fa-exclamation-triangle text-warning me-2"></i>待改进</h6>
                                    <ul class="list-group list-group-flush">
                                        ${matchAnalysis.weaknesses.map(weakness => `<li class="list-group-item border-0 px-0 py-1"><i class="fas fa-minus text-warning me-2"></i>${weakness}</li>`).join('')}
                                    </ul>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- 推荐建议 -->
                        ${matchAnalysis?.recommendations ? `
                        <div class="mt-4">
                            <h6><i class="fas fa-star text-info me-2"></i>推荐建议</h6>
                            <ul class="list-group list-group-flush">
                                ${matchAnalysis.recommendations.map(rec => `<li class="list-group-item border-0 px-0 py-1"><i class="fas fa-arrow-right text-info me-2"></i>${rec}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        <!-- 优化建议 -->
                        <div class="mt-4">
                            <h6><i class="fas fa-lightbulb text-primary me-2"></i>简历优化建议</h6>
                            <div class="suggestions-list">
                                ${optimizationError ? `<p class="text-muted">${optimizationError}</p>` : buildSuggestions(optimizationData?.suggestions || [])}
                            </div>
                        </div>
                        
                        <!-- 面试问题 -->
                        <div class="mt-4">
                            <h6><i class="fas fa-question-circle text-info me-2"></i>模拟面试问题</h6>
                            <div class="interview-questions">
                                ${interviewError ? `<p class="text-muted">${interviewError}</p>` : buildInterviewQuestions(data.interview_questions)}
                            </div>
                        </div>
                        
                        <!-- 操作按钮 -->
                        <div class="text-center mt-4">
                            <button class="btn btn-primary me-2" onclick="downloadResults()">
                                <i class="fas fa-download me-2"></i>下载报告
                            </button>
                            <button class="btn btn-secondary me-2" onclick="printResults()">
                                <i class="fas fa-print me-2"></i>打印结果
                            </button>
                            <button class="btn btn-outline-primary" onclick="resetAnalysis()">
                                <i class="fas fa-redo me-2"></i>重新分析
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function getScoreClass(score) {
            if (score >= 80) return 'score-excellent';
            if (score >= 60) return 'score-good';
            if (score >= 40) return 'score-fair';
            return 'score-poor';
        }

        function buildSkillTags(skills, type) {
            if (!skills || skills.length === 0) {
                return `<p class="text-muted">暂无${type === 'matched' ? '匹配' : '缺失'}技能</p>`;
            }
            
            return skills.map(skill => 
                `<span class="skill-tag skill-tag-${type}">${skill}</span>`
            ).join('');
        }

        function buildSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) {
                return '<p class="text-muted">暂无优化建议</p>';
            }
            
            return suggestions.map((suggestion, index) => `
                <div class="suggestion-item">
                    <span class="suggestion-number">${index + 1}</span>
                    <span class="suggestion-content">${suggestion.content || suggestion}</span>
                </div>
            `).join('');
        }

        function buildInterviewQuestions(interviewData) {
            // 处理后端返回的数据结构
            let questions = [];
            
            if (interviewData && interviewData.success && interviewData.data) {
                // 检查data中是否有questions数组
                if (interviewData.data.questions && Array.isArray(interviewData.data.questions)) {
                    questions = interviewData.data.questions;
                } else if (interviewData.data.interview_questions && Array.isArray(interviewData.data.interview_questions)) {
                    // 处理大模型返回的数据结构
                    questions = interviewData.data.interview_questions;
                } else if (Array.isArray(interviewData.data)) {
                    // 兼容旧格式，data本身就是questions数组
                    questions = interviewData.data;
                }
            } else if (Array.isArray(interviewData)) {
                // 兼容直接传递数组的情况
                questions = interviewData;
            }
            
            if (!questions || questions.length === 0) {
                const errorMsg = interviewData && interviewData.error ? interviewData.error : '暂无面试问题';
                return `<p class="text-muted">${errorMsg}</p>`;
            }
            
            return questions.map((q, index) => {
                // 检查是否是带标准答案的问题格式
                if (typeof q === 'object' && q.question && q.standard_answer) {
                    const typeClass = q.type === '技术' ? 'bg-info' : q.type === '行为' ? 'bg-success' : 'bg-warning';
                    const difficultyClass = q.difficulty === '初级' ? 'bg-success' : q.difficulty === '中级' ? 'bg-warning' : 'bg-danger';
                    
                    return `
                        <div class="mb-4 p-3 border rounded">
                            <div class="d-flex align-items-start mb-2">
                                <span class="badge bg-primary me-2">${index + 1}</span>
                                <div class="flex-grow-1">
                                    <div class="d-flex gap-2 mb-2">
                                        <span class="badge ${typeClass}">${q.type || '通用'}</span>
                                        <span class="badge ${difficultyClass}">${q.difficulty || '中级'}</span>
                                    </div>
                                    <p class="mb-2 fw-bold">${q.question}</p>
                                    <button class="btn btn-outline-info btn-sm" onclick="toggleAnswer(${index})">
                                        <i class="fas fa-eye me-1"></i>查看标准答案
                                    </button>
                                </div>
                            </div>
                            <div id="answer-${index}" class="mt-3" style="display: none;">
                                <div class="alert alert-light">
                                    <h6 class="text-success"><i class="fas fa-check-circle me-1"></i>标准答案：</h6>
                                    <p class="mb-2">${q.standard_answer}</p>
                                    ${q.evaluation_points && q.evaluation_points.length > 0 ? `
                                        <h6 class="text-info mt-3"><i class="fas fa-star me-1"></i>评分要点：</h6>
                                        <ul class="mb-0">
                                            ${q.evaluation_points.map(point => `<li>${point}</li>`).join('')}
                                        </ul>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 传统格式的问题
                    const question = typeof q === 'string' ? q : (q.question || q.text || q);
                    return `
                        <div class="interview-question">
                            <div class="question-header">
                                <span class="question-number">Q${index + 1}</span>
                                <span class="badge bg-primary">${q.type || '通用'}</span>
                            </div>
                            <p class="question-content">${question}</p>
                        </div>
                    `;
                }
            }).join('');
        }
        
        function toggleAnswer(index) {
            const answerDiv = document.getElementById(`answer-${index}`);
            const button = event.target.closest('button');
            
            if (answerDiv.style.display === 'none') {
                answerDiv.style.display = 'block';
                button.innerHTML = '<i class="fas fa-eye-slash me-1"></i>隐藏答案';
                button.classList.remove('btn-outline-info');
                button.classList.add('btn-outline-secondary');
            } else {
                answerDiv.style.display = 'none';
                button.innerHTML = '<i class="fas fa-eye me-1"></i>查看标准答案';
                button.classList.remove('btn-outline-secondary');
                button.classList.add('btn-outline-info');
            }
        }

        function downloadResults() {
            // 简单的文本下载功能
            const content = generateReportText();
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `简历分析报告_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateReportText() {
            const timestamp = new Date().toLocaleString('zh-CN');
            return `智能简历分析报告\n生成时间: ${timestamp}\n\n` +
                   `详细分析结果请查看网页版本。`;
        }

        function printResults() {
            window.print();
        }

        function resetAnalysis() {
            uploadedFile = null;
            fileInput.value = '';
            fileInfo.style.display = 'none';
            uploadArea.classList.remove('file-selected');
            jdTextarea.value = '';
            charCount.textContent = '0';
            charCount.classList.remove('text-success', 'text-danger');
            resultsDiv.style.display = 'none';
            validateForm();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showAlert(title, message) {
            document.getElementById('alertModalTitle').textContent = title;
            document.getElementById('alertModalBody').textContent = message;
            const modal = new bootstrap.Modal(document.getElementById('alertModal'));
            modal.show();
        }
    </script>
</body>
</html>
